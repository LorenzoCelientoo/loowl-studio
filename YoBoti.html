<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YoBoti</title>
<style>
  :root {
    --bg: #000000;
    --glow: #2b5fff;
    --glow-soft: rgba(43, 95, 255, 0.35);
    --text: #f5f5f7;
    --muted: #9aa0ab;
    --bubble-bot: #16181d;
    --bubble-user: #1d3fd6;
    --input-bg: #0a0a0d;
    --input-border: rgba(255,255,255,0.55);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="light"] {
    --bg: #000000;
    --text: #f5f5f7;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .app {
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  @media (min-width: 900px) {
    .app { max-width: 720px; }
  }
  .glow {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 22%, var(--glow-soft), transparent 70%),
      radial-gradient(ellipse 80% 30% at 10% 55%, rgba(43,95,255,0.18), transparent 70%),
      radial-gradient(ellipse 80% 30% at 90% 55%, rgba(43,95,255,0.18), transparent 70%);
    filter: blur(10px);
  }
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-top: calc(40px + env(safe-area-inset-top, 0px));
    padding-bottom: 18px;
    flex-shrink: 0;
    transition: padding 0.3s ease;
  }
  .hero.compact {
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: 10px;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3f4a, #101216 70%);
    box-shadow: 0 0 40px 6px var(--glow-soft), 0 0 0 1px rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    transition: width 0.3s ease, height 0.3s ease, font-size 0.3s ease;
    flex-shrink: 0;
  }
  .hero.compact .avatar {
    width: 46px;
    height: 46px;
    font-size: 22px;
  }
  .title {
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.2px;
    margin-top: 14px;
    transition: font-size 0.3s ease, margin 0.3s ease;
  }
  .hero.compact .title {
    font-size: 15px;
    margin-top: 8px;
  }
  .tagline {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 0.3px;
    transition: opacity 0.3s ease, height 0.3s ease, margin 0.3s ease;
  }
  .hero.compact .tagline {
    opacity: 0;
    height: 0;
    margin: 0;
    overflow: hidden;
  }
  @media (min-width: 900px) {
    .hero:not(.compact) .avatar {
      width: 160px;
      height: 160px;
      font-size: 76px;
    }
    .hero:not(.compact) .title {
      font-size: 40px;
      margin-top: 20px;
    }
    .hero:not(.compact) .tagline {
      font-size: 15px;
    }
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    z-index: 1;
  }
  .row { display: flex; width: 100%; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 15px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.4;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.06);
    border-bottom-left-radius: 4px;
  }
  .user .bubble {
    background: var(--bubble-user);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }
  .typing .bubble {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 12px 16px;
  }
  .typing .dot-anim {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing .dot-anim:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot-anim:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  form#composer {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
  }
  .input-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 999px;
    padding: 6px 6px 6px 20px;
    box-shadow: 0 0 18px rgba(255,255,255,0.05), 0 0 24px var(--glow-soft);
  }
  #input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-style: italic;
    outline: none;
    min-width: 0;
    padding: 8px 0;
  }
  #input::placeholder {
    color: var(--muted);
    font-style: italic;
  }
  button#send {
    background: linear-gradient(180deg, #3a63ff, #1d3fd6);
    color: #ffffff;
    border: none;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px var(--glow-soft);
  }
  button#send:active { transform: scale(0.94); }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
  @media (min-width: 900px) {
    #input, .bubble { font-size: 16px; }
    .input-wrap { padding: 8px 8px 8px 24px; }
    button#send { width: 44px; height: 44px; font-size: 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="glow"></div>
  <div class="hero" id="hero">
    <div class="avatar">🤖</div>
    <div class="title">YoBoti</div>
    <div class="tagline">Powered by Emma</div>
  </div>
  <div id="messages"></div>
  <form id="composer" autocomplete="off">
    <div class="input-wrap">
      <input id="input" type="text" placeholder="Che cos'è..." autocomplete="off" />
    </div>
    <button id="send" type="submit" aria-label="Invia">↑</button>
  </form>
</div>

<script>
  const RISPOSTE = [
    "Non lo so",
    "Non ne ho idea!",
    "Boh, proprio non saprei.",
    "Mah, chi lo sa...",
    "Non ne ho la minima idea.",
    "Nessuna idea, mi dispiace.",
    "Non ho la più pallida idea.",
    "Chissà!",
    "Non saprei proprio dirtelo.",
    "Chi lo sa, sinceramente.",
    "Non ci arrivo proprio, boh.",
    "Eh, questa e' tosta.",
    "Ma che cazzo di domande fai?",
    "Boh, e chi lo capisce 'sto casino.",
    "Ma che domanada, non ne ho idea.",
    "Che palle, non lo so proprio."
  ];

  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const hero = document.getElementById('hero');
  let compact = false;

  function addMessage(text, who) {
    const row = document.createElement('div');
    row.className = 'row ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'row bot typing';
    row.innerHTML = '<div class="bubble"><span class="dot-anim"></span><span class="dot-anim"></span><span class="dot-anim"></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function randomRisposta() {
    return RISPOSTE[Math.floor(Math.random() * RISPOSTE.length)];
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    if (!compact) {
      hero.classList.add('compact');
      compact = true;
    }
    addMessage(text, 'user');
    input.value = '';
    const typingRow = showTyping();
    const delay = 500 + Math.random() * 700;
    setTimeout(function() {
      typingRow.remove();
      addMessage(randomRisposta(), 'bot');
    }, delay);
  });
</script>
</body>
</html>
